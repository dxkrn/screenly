name: screenly
version: 1.0.0+1
publish_to: none
description: A flutter getx project starter by dxkrn
environment:
  sdk: '>=3.5.3 <=4.0.0'

dependencies:
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8
  flutter:
    sdk: flutter
  flutter_flavor: ^3.1.4
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  get: ^4.7.3
  hive: ^2.2.3
  lottie: ^3.3.2
  path_provider: ^2.1.5
  skeletonizer: ^2.1.1

dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  rename_app: ^1.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lotties/
    - assets/translations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon_launcher.png"
  min_sdk_android: 21